name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build from ZIP
        run: |
          Z=$(find . -name "Daniel-PDF-Gal.zip" -not -path "./.git/*" | head -1)
          if [ -z "$Z" ]; then echo "Daniel-PDF-Gal.zip not found - upload it to the repo"; exit 1; fi
          rm -rf /tmp/src && mkdir -p /tmp/src && unzip -q "$Z" -d /tmp/src
          cd "$(dirname "$(find /tmp/src -name settings.gradle.kts | head -1)")"
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Daniel-PDF-Gal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Daniel-PDF-Gal
          path: Daniel-PDF-Gal.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Daniel-PDF-Gal build ${{ github.run_number }}
          files: Daniel-PDF-Gal.apk
