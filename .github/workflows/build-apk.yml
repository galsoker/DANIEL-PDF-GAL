name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          echo "== repo files =="; find . -maxdepth 3 -not -path "./.git*" | sort
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$F" ]; then echo "settings.gradle.kts not found!"; exit 1; fi
          cd "$(dirname "$F")"
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/DANIEL-PDF.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DANIEL-PDF
          path: DANIEL-PDF.apk
      - name: Release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DANIEL PDF build ${{ github.run_number }}
          files: DANIEL-PDF.apk
